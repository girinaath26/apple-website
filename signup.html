        <div class="card">

            <h1>Create Your Apple Account</h1>
            <p class="subtitle">One Apple ID is all you need to access all Apple services.</p>

            <form id="signupForm" novalidate>

                <div class="form-row">
                    <div class="input-group">
                        <input type="text" id="firstName" placeholder=" " autocomplete="given-name">
                        <label for="firstName">First Name</label>
                        <small class="error-msg" id="firstNameError"></small>
                    </div>

                    <div class="input-group">
                        <input type="text" id="lastName" placeholder=" " autocomplete="family-name">
                        <label for="lastName">Last Name</label>
                        <small class="error-msg" id="lastNameError"></small>
                    </div>
                </div>

                <div class="input-group">
                    <input type="text" id="email" placeholder=" " autocomplete="email">
                    <label for="email">name@example.com</label>
                    <small class="error-msg" id="emailError"></small>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder=" " autocomplete="new-password">
                    <label for="password">Password</label>
                    <small class="error-msg" id="passwordError"></small>
                </div>

                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder=" " autocomplete="new-password">
                    <label for="confirmPassword">Confirm Password</label>
                    <small class="error-msg" id="confirmPasswordError"></small>
                </div>

		<div class="input-group">
    			<select id="countryCode">
        			<option value="+91" selected>🇮🇳 India (+91)</option>
        			<option value="+1">🇺🇸 USA (+1)</option>
        			<option value="+44">🇬🇧 UK (+44)</option>
        			<option value="+61">🇦🇺 Australia (+61)</option>
        			<option value="+81">🇯🇵 Japan (+81)</option>
        			<option value="+86">🇨🇳 China (+86)</option>
        			<option value="+971">🇦🇪 UAE (+971)</option>
        			<option value="+49">🇩🇪 Germany (+49)</option>
        			<option value="+33">🇫🇷 France (+33)</option>
        			<option value="+7">🇷🇺 Russia (+7)</option>
    			</select>
    			<label for="countryCode">Country Code</label>
		</div>

                <div class="input-group">
                    <input type="text" id="phone" placeholder=" " autocomplete="tel" maxlength="10">
                    <label for="phone">Phone Number</label>
                    <small class="error-msg" id="phoneError"></small>
                </div>

                <button type="submit" id="submitBtn">Continue</button>

            </form>

        </div>
